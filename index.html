<style>
/* Layout: one column of rug cards (max 560px), sticky progress header, posted rugs in a collapsed "Done" section.
   One font (the phone's own system font), neutral greys, one dark filled button per card. */
:root {
  --bg: #f5f4f2; --surface: #ffffff; --sunken: #efedea; --ink: #1c1b1a; --muted: #6f6b67;
  --line: #e4e1dd; --primary: #1c1b1a; --on-primary: #ffffff; --tonal: #ecebe8; --ok: #2e7d4f;
  --photo-bg: #ffffff; --shadow: 0 1px 2px rgba(28,27,26,.05), 0 4px 16px rgba(28,27,26,.05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --surface: #1c1c1d; --sunken: #262627; --ink: #f2f1ef; --muted: #a4a19d;
    --line: #2f2f31; --primary: #f2f1ef; --on-primary: #121212; --tonal: #2a2a2c; --ok: #5fc48a;
    --photo-bg: #f4f4f4; --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 var(--font);
  padding-bottom: max(32px, env(safe-area-inset-bottom));
}
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: 14px; border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: -.02em; margin: 0; }
.meta { color: var(--muted); font-size: .95rem; margin: 4px 0 0; }
.progress { display: flex; flex-direction: column; gap: 7px; }
.progress .row { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .row b { color: var(--ink); font-weight: 600; }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; }

main { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }

/* card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.gallery { position: relative; background: var(--photo-bg); }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.slides::-webkit-scrollbar { display: none; }
.slides img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; scroll-snap-align: center; display: block; background: var(--photo-bg); }
.slides img.product { object-fit: contain; }
.dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #ffffff; opacity: .5; box-shadow: 0 0 3px rgba(0,0,0,.45); }
.dots i.on { opacity: 1; }
.badge { position: absolute; top: 10px; right: 10px; background: rgba(20,20,20,.62); color: #ffffff; font-size: .8rem;
  padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }

.body { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px; }
.title { font-size: 1.05rem; font-weight: 600; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.price { font-size: 2.1rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 0; }
.price small { font-size: .95rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink); }
.tags li.unknown { color: var(--muted); }
.tags li.tap { cursor: pointer; border: 1px dashed var(--line); background: none; color: var(--muted); padding: 3px 9px; }
.tags li.tap.set { border-style: solid; border-color: transparent; background: var(--sunken); color: var(--ink); }
.tags li.tap:active { transform: scale(.97); }
.setting { display: flex; align-items: center; justify-content: space-between; font-size: .9rem; color: var(--muted); }
.setting label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
.setting input { width: 18px; height: 18px; accent-color: var(--ink); }

details.desc { border-top: 1px solid var(--line); padding-top: 10px; }
details.desc summary { cursor: pointer; color: var(--muted); font-size: .95rem; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
details.desc summary::-webkit-details-marker { display: none; }
details.desc summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-3px); }
details.desc[open] summary::after { transform: rotate(-135deg) translateY(-1px); }
details.desc p { margin: 8px 0 0; font-size: .95rem; color: var(--ink); white-space: pre-line; }

.actions { display: flex; flex-direction: column; gap: 8px; }
/* one button per field on Facebook's listing form, in the order they appear there */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair .wide { grid-column: 1 / -1; }
.btn { appearance: none; border: 0; border-radius: 14px; min-height: 52px; padding: 10px 12px; font: 600 1rem var(--font);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--primary); color: var(--on-primary); min-height: 56px; font-size: 1.05rem; }
.btn.tonal { background: var(--tonal); color: var(--ink); }
.btn.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.btn.text { background: none; color: var(--muted); min-height: 44px; font-weight: 500; font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; }
.btn:active { transform: scale(.985); }
.btn:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.pair .btn { font-size: .95rem; padding: 10px 8px; }
.pair .btn:not(.ok) svg { display: none; }  /* keeps "Copy description" on one line on small phones */

/* done section */
details.done-section { margin-top: 10px; }
details.done-section > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 4px; color: var(--muted); font-weight: 600; font-size: .95rem; }
details.done-section > summary::-webkit-details-marker { display: none; }
details.done-section > summary .chev { width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }
details.done-section[open] > summary .chev { transform: rotate(-135deg); }
.done-list { display: flex; flex-direction: column; gap: 10px; }
.done-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.done-row img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; background: var(--photo-bg); }
.done-row .t { flex: 1; min-width: 0; font-size: .92rem; color: var(--muted); }
.done-row .t b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done-row .btn.text { min-height: 40px; padding: 6px 10px; }

.empty { text-align: center; color: var(--muted); padding: 28px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: .85rem; }

/* toast */
.toast { position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px)); transform: translate(-50%, 20px);
  background: var(--primary); color: var(--on-primary); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .95rem;
  opacity: 0; pointer-events: none; z-index: 20; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* large-photo fallback for long-press saving */
.viewer { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 30;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.viewer .vtop { position: sticky; top: 0; background: var(--bg); padding: 8px 0 12px; display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
.viewer p { margin: 0; }
.viewer .list { display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.viewer img { width: 100%; border-radius: 12px; display: block; -webkit-touch-callout: default; }

@media (prefers-reduced-motion: no-preference) {
  .bar span { transition: width .4s ease; }
  .toast { transition: opacity .2s, transform .2s; }
  .btn { transition: transform .08s, background-color .2s, color .2s; }
}
</style>
</head>
<body>
<div class="top" id="top">
  <div class="wrap">
    <div>
      <h1>Your listings</h1>
      <p class="meta">Lot 21136125 · 10 rugs</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="row"><b id="count"></b><span id="left"></span></div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <div class="setting">
      <label><input type="checkbox" id="obo"> Add "OBO" to prices</label>
      <button class="btn text" type="button" id="category"></button>
      <button class="btn text" type="button" id="allcond"></button>
      <button class="btn text" type="button" id="pickdir" hidden></button>
    </div>
  </div>
</div>
<div class="wrap">
  <main id="list"></main>
  <details class="done-section" id="done-section" hidden>
    <summary><span id="done-label">Done</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="done-list" id="done-list"></div>
  </details>
  <footer>Prepared by Threshold</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="viewer" id="viewer" hidden>
  <div class="vtop">
    <p><b>Press and hold each photo</b>, then tap <b>Save to Photos</b>.</p>
    <button class="btn primary" id="close" type="button">Done</button>
  </div>
  <div class="list" id="viewer-list"></div>
</div>

const RUGS = [{"id": "1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP", "title": "10' x 10' Hermitage Round Rug - SNOW WHITE", "price": "175", "condition": "", "description": "$175 OBO\n\nThe Hermitage Collection offers a subtly textured and patterned 10 Ft Round rug, crafted from a durable blend of 55% Polypropylene and 45% Polyester. It features a refined geometric motif expressed in a palette of Snow White and Beige, set against a Snow White background. The piece's neutral tones and clean design ensure versatility in a variety of interior settings.\n\nThe rug's low pile and stain-resistant materials provide a practical solution for high-traffic areas, making maintenance effortless. Its shed-free quality ensures that the rug maintains a consistent appearance over time. The sophisticated yet understated pattern complements contemporary, minimalist, and Scandinavian decors, acting as a grounding element in living rooms, bedrooms, or under a dining table in an open-plan space. This Hermitage rug's serene color scheme and round shape would also work well in rooms aiming for a soft, tranquil feel, such as a nursery or a restful reading nook.", "photos": ["photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/1.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/2.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/3.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/4.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/5.jpg"], "views": ["photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/v1.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/v2.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/v3.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/v4.jpg", "photos/1_qIIUVmRJ302rkd3JmAr-n_AkZ392zvP/v5.jpg"], "rooms": 4, "size": "10' x 10' Round", "quantity": 1}, {"id": "14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9", "title": "10' x 10' Oregon Round Rug - IVORY", "price": "125", "condition": "", "description": "$125 OBO\n\nA softly distressed medallion anchors this round rug, its ornamental center and decorative border rendered in a washed palette of ivory, beige, and gray. The ivory background brightens the design while the beige field and subtle gray outlining create gentle contrast, giving the pattern a lived-in, layered look. The floral and scroll motifs are deliberately muted, so the overall effect reads as vintage-inspired without heavy contrast.\n\nMachine made from 85% polypropylene and 15% polyester, the rug has a low, dense pile that feels smooth underfoot with a slight velvety touch. Its neutral tones and understated ornamentation make it well suited for transitional, coastal, or modern farmhouse interiors. Use it beneath a round dining table to ground the space, place it under a circular seating arrangement in a living room, or layer it in a bedroom beneath the bed to add warmth and visual interest. Pair with natural wood furniture and soft linens for a relaxed look, or add black metal accents and textured throws for a contemporary contrast.", "photos": ["photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/1.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/2.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/3.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/4.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/5.jpg"], "views": ["photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/v1.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/v2.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/v3.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/v4.jpg", "photos/14Gn408lmuhuyhIy1ERcWgwr3UlqwH2P9/v5.jpg"], "rooms": 3, "size": "10' x 10' Round", "quantity": 1}, {"id": "1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY", "title": "10' x 14' Blossom Rug - MULTICOLORED", "price": "250", "condition": "", "description": "$250 OBO\n\nAn all-over botanical pattern fills the surface with overlapping tropical leaves and textured fronds rendered in painterly detail. Variegated stripes, ribbed veins and soft shading create depth across a multi-toned background, while pops of rust red and warm beige lift the deeper olive, hunter green and brown tones. Ivory highlights balance the palette and bring subtle contrast so the design reads lively without feeling busy.\n\nMachine-made from 100% polypropylene, the rug has a low, dense pile that feels smooth underfoot and shows the pattern crisply. Its durable construction and grounded color story make it suited to larger living areas or open-plan rooms where you want a strong focal layer. Pair it with warm wood furniture, leather or rattan pieces for a grounded, natural look, or use it in a sunroom or home office to introduce a botanical, layered feel without overwhelming the space.", "photos": ["photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/1.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/2.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/3.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/4.jpg"], "views": ["photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/v1.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/v2.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/v3.jpg", "photos/1kDFKmmp7zfeYJjLigZjTxuDrz-3u1CBY/v4.jpg"], "rooms": 3, "size": "10' x 14'", "quantity": 1}, {"id": "1jcj6Yi2cjj-0WsXrz6-fzvhS1MEjXMZ1", "title": "10' x 12' 4 Lola Rug - BRICK RED", "price": "175", "condition": "", "description": "$175 OBO\n\nA rich brick red field sets the stage for an antique-inspired medallion and scrolling vine pattern rendered in vibrant blues, light blue highlights, ivory, orange and yellow. The design has a gently distressed look that reveals layered color beneath the surface, giving the motif a lived-in, vintage character while a narrow, lighter floral border frames the composition. Running your hand across the surface, you’ll notice a low-pile, tightly woven feel; the machine-made polypropylene construction offers a soft hand with a subtle sheen that showcases the color contrasts and fine line work.\n\nThis rug works well as an anchor in a living room beneath a sofa and coffee table, under a dining table to introduce warmth, or in a study to add color and pattern without overwhelming the space. It pair const KEY = "posted-rugs";
let posted = {};
try { posted = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const files = {};  // rug id -> Promise<File[]>, fetched ahead so the share sheet opens right away

function savePosted() { try { localStorage.setItem(KEY, JSON.stringify(posted)); } catch (e) {} }

// Per-rug fields she fills in: the Marketplace condition, and the manufacturer's price
// she shows buyers so they can compare. Both are remembered on her phone.
const FIELDS_KEY = "rug-fields";
let fields = {};
try { fields = JSON.parse(localStorage.getItem(FIELDS_KEY) || "{}"); } catch (e) {}
function saveFields() { try { localStorage.setItem(FIELDS_KEY, JSON.stringify(fields)); } catch (e) {} }
function fieldsFor(id) { return fields[id] || (fields[id] = {}); }

// Facebook Marketplace's own wording, in the order it lists them
const CONDITIONS = ["New", "Used - like new", "Used - good", "Used - fair"];

const OPTS_KEY = "rug-opts";
// A lot is almost always one kind of item in one rough state, so category and condition
// are set once for all of them. Tapping a rug's own tag overrides just that one.
// "Used - like new" is what nearly all her past listings said, and neither manifest
// carries a usable condition: the rug lot has no column, the Wayfair one only says
// "Returns" for every row.
let opts = { obo: true, category: "Rugs", condition: "Used - like new" };
try { Object.assign(opts, JSON.parse(localStorage.getItem(OPTS_KEY) || "{}")); } catch (e) {}
function saveOpts() { try { localStorage.setItem(OPTS_KEY, JSON.stringify(opts)); } catch (e) {} }

// The generated description starts with its own price line. Strip it so we can rebuild
// the top from the current price, the OBO setting and the retail comparison.
function bodyOf(rug) {
  const parts = rug.description.split("\n\n");
  return (parts.length > 1 && /^\$[\d,]+/.test(parts[0].trim()) ? parts.slice(1) : parts).join("\n\n");
}

function priceLine(rug) {
  return "$" + rug.price + (opts.obo ? " OBO" : "");
}

function fullDescription(rug) {
  const retail = fieldsFor(rug.id).retail;
  const lines = [priceLine(rug)];
  if (retail) lines.push(`Retails for $${retail}. Yours for $${rug.price}.`);
  lines.push(bodyOf(rug));
  return lines.join("\n\n");
}

// Sheet sync: each tap is queued on the phone and sent to the sheet; anything that fails
// (no internet) stays queued and is sent again the next time the page opens.
const SYNC = {"url": "", "token": "NszTc4nRpw91dIWk1mnqUh1JdXQsZVi0", "tab": "Demo"};
const QKEY = "sheet-queue";
let queue = {};
try { queue = JSON.parse(localStorage.getItem(QKEY) || "{}"); } catch (e) {}
function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch (e) {} }

async function flush() {
  if (!SYNC.url) return;
  for (const [id, mark] of Object.entries(queue)) {
    try {
      // text/plain keeps this a "simple" request, which Apps Script accepts from another site
      const res = await fetch(SYNC.url, { method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: SYNC.token, tab: SYNC.tab, id, posted: mark.posted, at: mark.at }) });
      const out = await res.json();
      if (out.ok && queue[id] && queue[id].at === mark.at) { delete queue[id]; saveQueue(); }
    } catch (e) { return; }  // offline: try again next time
  }
}

function queueMark(id) {
  queue[id] = { posted: !!posted[id], at: posted[id] || Date.now() };
  saveQueue();
  flush();
}

function getFiles(rug) {
  if (!files[rug.id]) {
    files[rug.id] = Promise.all(rug.photos.map(async (src, i) => {
      const blob = await (await fetch(src)).blob();
      return new File([blob], `rug-${i + 1}.jpg`, { type: "image/jpeg" });
    }));
  }
  return files[rug.id];
}

let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg>',
};
function setLabel(btn, icon, text) { btn.innerHTML = ICON[icon]; btn.append(text); }

// feedback: the button turns green with a check, a toast says what happened, the phone buzzes once
function confirmDone(btn, icon, label, done, message) {
  setLabel(btn, "check", done); btn.classList.add("ok"); buzz(); toast(message);
  setTimeout(() => { setLabel(btn, icon, label); btn.classList.remove("ok"); }, 1600);
}

async function copy(text, btn, label, what) {
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    // older browsers: copy through a hidden text box
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    ok = document.execCommand("copy"); t.remove();
  }
  if (ok) confirmDone(btn, "copy", label, "Copied", `${what} copied`);
  else toast("Couldn't copy. Press and hold the text instead.");
}

function showLarge(rug) {
  const list = document.getElementById("viewer-list");
  list.replaceChildren(...rug.photos.map((src, i) => {
    const img = document.createElement("img"); img.src = src; img.alt = `${rug.title}, photo ${i + 1}`; return img;
  }));
  document.getElementById("viewer").hidden = false;
  document.getElementById("viewer").scrollTop = 0;
}

// "10' x 10' Hermitage Round Rug - SNOW WHITE" -> "Hermitage-Snow-White".
// The colour has to stay in the name: two of these rugs are both called Oregon,
// and without it their photos would overwrite each other in Downloads.
function fileBase(title) {
  const [front, colour = ""] = title.split(" - ");
  const name = front.replace(/^[\d' x]+(?=[A-Za-z])/, "")
    .replace(/\b(Round|Square|Area|Rug|Runner|Oval)\b/g, "").trim();
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const joined = [slug(name), slug(colour)].filter(Boolean).join("-") || "rug";
  return joined.replace(/(^|-)([a-z])/g, (m, dash, c) => dash + c.toUpperCase());
}

// Chrome and Edge can write into a folder she picks, so each rug's five photos land
// together in their own folder instead of loose in Downloads. She picks the folder once;
// after that every Save drops a new folder inside it, ready to select all and drag in.
let saveDir = null;
const canPickDir = typeof window.showDirectoryPicker === "function";

// The folder she picks is remembered between visits, so she is only ever asked once.
// A folder handle can't go in localStorage, so it lives in a one-row IndexedDB store.
function dirStore(mode, fn) {
  return new Promise(resolve => {
    const open = indexedDB.open("rug-dir", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("h");
    open.onerror = () => resolve(null);
    open.onsuccess = () => {
      const req = fn(open.result.transaction("h", mode).objectStore("h"));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    };
  });
}

async function rememberDir(handle) { await dirStore("readwrite", s => s.put(handle, "dir")); }

async function restoreDir() {
  if (!canPickDir) return;
  const handle = await dirStore("readonly", s => s.get("dir"));
  if (!handle) return;
  // Chrome usually re-grants a folder she has used before without asking again
  try {
    if (await handle.queryPermission({ mode: "readwrite" }) === "granted") saveDir = handle;
    else if (await handle.requestPermission({ mode: "readwrite" }) === "granted") saveDir = handle;
  } catch (e) {}
  showDirLabel();
}

async function pickDir() {
  try {
    saveDir = await showDirectoryPicker({ id: "rugs", mode: "readwrite", startIn: "downloads" });
    await rememberDir(saveDir);
    showDirLabel();
    return true;
  } catch (e) { return false; }  // she closed the picker
}

function showDirLabel() {
  const b = document.getElementById("pickdir");
  if (!canPickDir) return;
  b.hidden = false;
  b.textContent = saveDir ? `Saving to ${saveDir.name}` : "Choose where photos save";
}

async function writeToDir(rug) {
  const base = fileBase(rug.title);
  const f = await getFiles(rug);
  const dir = await saveDir.getDirectoryHandle(base, { create: true });
  for (let i = 0; i < f.length; i++) {
    const handle = await dir.getFileHandle(`${base}-${i + 1}.jpg`, { create: true });
    const w = await handle.createWritable();
    await w.write(f[i]);
    await w.close();
  }
  return base;
}

// Fallback when she hasn't picked a folder, or on a browser without the API:
// straight to Downloads, with the rug's name on every file so they stay findable.
async function downloadPhotos(rug, btn, label) {
  const base = fileBase(rug.title);
  const f = await getFiles(rug);
  for (let i = 0; i < f.length; i++) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f[i]);
    a.download = `${base}-${i + 1}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    await new Promise(r => setTimeout(r, 250));  // browsers drop downloads fired all at once
  }
  confirmDone(btn, "save", label, "Saved", `${f.length} photos → Downloads`);
}

async function savePhotos(rug, btn, label) {
  if (!rug.photos.length) { toast("No photos for this rug"); return; }

  // Best case: write the five photos into their own folder inside the one she picked.
  // The first Save asks her where; after that it just happens.
  if (canPickDir) {
    if (!saveDir) { toast("Pick a folder to save into"); if (!await pickDir()) return; }
    try {
      const base = await writeToDir(rug);
      confirmDone(btn, "save", label, "Saved", `${saveDir.name} › ${base}`);
      return;
    } catch (e) {
      saveDir = null; showDirLabel();  // permission withdrawn or folder gone
    }
  }

  // laptop and Android: straight to Downloads (Android shows them in Gallery); iPhone: share sheet
  if (matchMedia("(hover: hover) and (pointer: fine)").matches || /Android/i.test(navigator.userAgent)) {
    try { await downloadPhotos(rug, btn, label); } catch (e) { showLarge(rug); }
    return;
  }
  try {
    const f = await getFiles(rug);
    if (navigator.canShare && navigator.canShare({ files: f })) {
      await navigator.share({ files: f });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;  // she closed the share sheet
  }
  showLarge(rug);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function button(cls, icon, label, fn) {
  const b = el("button", "btn " + cls); b.type = "button";
  if (icon) setLabel(b, icon, label); else b.textContent = label;
  b.onclick = () => fn(b);
  return b;
}

function togglePosted(rug) {
  if (posted[rug.id]) delete posted[rug.id]; else posted[rug.id] = Date.now();
  savePosted(); queueMark(rug.id); buzz();
  toast(posted[rug.id] ? "Moved to Done" : "Moved back to your listings");
  render();
}

function gallery(rug) {
  const gal = el("div", "gallery");
  const slides = el("div", "slides");
  rug.views.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src; img.alt = `${rug.title}, photo ${i + 1}`; img.loading = "lazy"; img.decoding = "async";
    if (i >= rug.rooms) img.className = "product";  // product shots on white show whole; room shots fill the frame
    slides.appendChild(img);
  });
  gal.appendChild(slides);
  if (rug.views.length > 1) {
    const dots = el("div", "dots");
    rug.views.forEach((_, i) => dots.appendChild(el("i", i ? "" : "on")));
    const badge = el("span", "badge", `1 / ${rug.views.length}`);
    const update = () => {
      const n = Math.round(slides.scrollLeft / slides.clientWidth);
      [...dots.children].forEach((d, i) => d.classList.toggle("on", i === n));
      badge.textContent = `${n + 1} / ${rug.views.length}`;
    };
    // "scrollend" catches the final photo when a phone batches scroll events during a fast swipe
    slides.addEventListener("scroll", update, { passive: true });
    slides.addEventListener("scrollend", update);
    gal.append(dots, badge);
  }
  return gal;
}

// a tag you can tap to fill in
function chip(text, isSet, fn) {
  const li = el("li", "tap" + (isSet ? " set" : ""), text);
  li.tabIndex = 0; li.setAttribute("role", "button");
  const go = () => { fn(); buzz(); render(); };
  li.onclick = go;
  li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  return li;
}

function card(rug) {
  const c = el("article", "card");
  if (rug.views.length) c.appendChild(gallery(rug));
  const body = el("div", "body");
  const f = fieldsFor(rug.id);
  const price = el("p", "price", rug.price ? "$" + rug.price : "$?");
  if (opts.obo) price.appendChild(el("small", "", "OBO"));
  const tags = el("ul", "tags");
  if (rug.size) tags.appendChild(el("li", "", rug.size));

  // Starts on the lot's default. Tap to step through Marketplace's options for this rug only.
  const cond = f.condition || rug.condition || opts.condition;
  tags.appendChild(chip(cond, true, () => {
    const i = CONDITIONS.indexOf(cond);
    f.condition = CONDITIONS[(i + 1) % CONDITIONS.length];
    saveFields();
  }));

  // the dropdown she picks on Marketplace — same for every rug in the lot, shown here
  // so she doesn't have to scroll back up while the form is open
  tags.appendChild(chip(opts.category, true, () => {
    const v = prompt("What category do these go under?", opts.category);
    if (v === null || !v.trim()) return;
    opts.category = v.trim(); saveOpts(); showCategory();
  }));

  // the manufacturer's price, so buyers can compare — goes into the description
  tags.appendChild(chip(f.retail ? "Retails $" + f.retail : "Retail: tap to add", !!f.retail, () => {
    const v = prompt("What does the manufacturer sell it for?", f.retail || "");
    if (v === null) return;
    const n = v.replace(/[^\d]/g, "");
    if (n) f.retail = n; else delete f.retail;
    saveFields();
  }));

  tags.appendChild(el("li", "", "Qty " + rug.quantity));
  const desc = el("details", "desc");
  desc.append(el("summary", "", "Description"), el("p", "", fullDescription(rug)));
  const saveLabel = `Save ${rug.photos.length} photo${rug.photos.length === 1 ? "" : "s"}`;
  // Only the typed boxes get a copy button. Category and condition are dropdowns on
  // Marketplace and won't take a paste, so those are shown as tags to read off instead.
  const pair = el("div", "pair");
  pair.append(
    button("tonal", "copy", "Copy title", b => copy(rug.title, b, "Copy title", "Title")),
    button("tonal", "copy", "Copy price", b => copy(rug.price, b, "Copy price", "Price")),
  );
  const descBtn = button("tonal", "copy", "Copy description", b => copy(fullDescription(rug), b, "Copy description", "Description"));
  descBtn.classList.add("wide");
  pair.appendChild(descBtn);
  const actions = el("div", "actions");
  actions.append(
    button("primary", "save", saveLabel, b => savePhotos(rug, b, saveLabel)),
    pair,
    button("text", null, "Mark as posted", () => togglePosted(rug)),
  );
  body.append(el("h2", "title", rug.title), price, tags, desc, actions);
  c.appendChild(body);
  // fetch full-size photos only for the card on screen, so the share sheet opens instantly
  new IntersectionObserver((entries, obs) => {
    if (entries.some(e => e.isIntersecting)) { getFiles(rug).catch(() => {}); obs.disconnect(); }
  }, { threshold: 0.5 }).observe(c);
  return c;
}

function doneRow(rug) {
  const r = el("div", "done-row");
  const img = document.createElement("img"); img.src = rug.views[0] || ""; img.alt = ""; img.loading = "lazy";
  const t = el("div", "t"); t.append(el("b", "", rug.title), "$" + rug.price);
  r.append(img, t, button("text", null, "Undo", () => togglePosted(rug)));
  return r;
}

function render() {
  const open = RUGS.filter(r => !posted[r.id]);
  const done = RUGS.filter(r => posted[r.id]);
  const list = document.getElementById("list");
  list.replaceChildren(...open.map(card));
  if (!open.length) list.appendChild(el("div", "empty", "Every rug is posted."));
  document.getElementById("done-section").hidden = !done.length;
  document.getElementById("done-label").textContent = `Done (${done.length})`;
  document.getElementById("done-list").replaceChildren(...done.map(doneRow));
  document.getElementById("count").textContent = `${done.length} of ${RUGS.length} posted`;
  document.getElementById("left").textContent = open.length ? `${open.length} to go` : "All done";
  document.getElementById("bar").style.width = `${Math.round(100 * done.length / RUGS.length)}%`;
}

addEventListener("scroll", () => document.getElementById("top").classList.toggle("scrolled", scrollY > 4), { passive: true });
document.getElementById("close").onclick = () => { document.getElementById("viewer").hidden = true; };
const oboBox = document.getElementById("obo");
oboBox.checked = !!opts.obo;
oboBox.onchange = () => { opts.obo = oboBox.checked; saveOpts(); render(); };
const catBtn = document.getElementById("category");
function showCategory() { catBtn.textContent = `Category: ${opts.category}`; }
catBtn.onclick = () => {
  const v = prompt("What category do these go under on Marketplace?", opts.category);
  if (v === null || !v.trim()) return;
  opts.category = v.trim(); saveOpts(); showCategory(); render();
};
showCategory();

// Changing the lot default clears the per-rug overrides, so "they're all like new"
// is one tap rather than 455.
const allCond = document.getElementById("allcond");
function showAllCond() { allCond.textContent = `All: ${opts.condition}`; }
allCond.onclick = () => {
  const i = CONDITIONS.indexOf(opts.condition);
  opts.condition = CONDITIONS[(i + 1) % CONDITIONS.length];
  saveOpts();
  for (const id in fields) delete fields[id].condition;
  saveFields(); showAllCond(); render();
};
showAllCond();

document.getElementById("pickdir").onclick = pickDir;
showDirLabel();
restoreDir();
render();
flush();
addEventListener("online", flush);
</script>
</body>
