<style>
/* One column of rug cards, thumb-reachable buttons; posted rugs sink to the bottom. */
:root {
  --bg: #f6f3ef; --card: #ffffff; --ink: #1f1a17; --muted: #6b625b;
  --line: #e2dbd3; --accent: #8c2f2b; --accent-ink: #ffffff; --ok: #2f6b3a;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171412; --card: #221e1b; --ink: #f2ece6; --muted: #b3a89f;
    --line: #3a332e; --accent: #d8665f; --accent-ink: #1a0f0e; --ok: #7fc28b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 var(--font);
  padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
}
header { max-width: 560px; margin: 0 auto 16px; }
header h1 { font-size: 1.35rem; margin: 4px 0 2px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 1rem; }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column; }
.card.posted { opacity: .45; filter: grayscale(1); }
.hero { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; background: var(--line); }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.title { font-size: 1.1rem; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
.facts { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.price { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.cond { font-size: 1rem; color: var(--muted); }
.cond b { color: var(--ink); }
.desc { font-size: 1rem; color: var(--muted); white-space: pre-line; max-height: 5.8em; overflow: hidden; margin: 0; }
.desc.open { max-height: none; }
.more { align-self: flex-start; background: none; border: 0; color: var(--accent); font: inherit; font-size: 1rem;
  padding: 4px 0; text-decoration: underline; cursor: pointer; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button.big { min-height: 56px; border-radius: 12px; font: 700 1.05rem var(--font); cursor: pointer;
  border: 2px solid var(--accent); background: var(--card); color: var(--accent); padding: 8px 10px; }
button.big.primary { background: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; }
button.big.done { border-color: var(--ok); color: var(--ok); }
button.big.posted-btn { grid-column: 1 / -1; border-color: var(--line); color: var(--ink); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
/* large-photo fallback for long-press saving */
.viewer { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.viewer .top { position: sticky; top: 0; background: var(--bg); padding: 8px 0 12px; display: flex; flex-direction: column; gap: 10px; }
.viewer p { margin: 0; font-size: 1.05rem; }
.viewer .list { display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.viewer img { width: 100%; border-radius: 10px; display: block; -webkit-touch-callout: default; }
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .2s; } }
</style>

4.jpg", "photos/1gvyiTBbJJmkbsH7QekT8cGk5tI_Y2huT/5.jpg"]}, {"id": "1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y", "title": "10' x 13' Solid Shag Rug - TAUPE", "price": "175", "condition": "", "description": "$175 OBO\n\nA solid taupe rug with a deep shag pile, machine-made from 100% polypropylene. The dense fibers create a soft, cushioned surface you can feel underfoot—plush and slightly springy—while subtle tonal shifts in the yarn add visual depth without any distinct pattern. The overall look is clean and understated, letting the texture be the focal point.\n\nThis neutral piece works well as an anchor for a living room seating area, a cozy layer under a bed, or a relaxed family room where softness matters. It pairs naturally with warm woods, leather accents, and layered textiles in both contemporary and transitional interiors, and complements mid-century modern or rustic furnishings alike. The machine-made construction yields an even pile and consistent texture across the rug.", "photos": ["photos/1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y/1.jpg", "photos/1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y/2.jpg", "photos/1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y/3.jpg", "photos/1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y/4.jpg", "photos/1bktElPq9qafpUJsDUMw9zaEhImoL7o8Y/5.jpg"]}, {"id": "1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v", "title": "10' x 13' Infinity Shag Rug - LINEN", "price": "235", "condition": "", "description": "$235 OBO\n\nA linen ground provides a neutral, soft backdrop while a subtle, low-relief linear pattern gives the surface quiet depth and interest. The long, plush pile is machine made from 100% polyester and feels dense and cushiony underfoot; the yarns form gentle striations that add a layered, tactile quality across the field. The overall effect is a warm, subdued texture that complements a range of interiors without calling attention to itself.\n\nPlace this rug under a sofa grouping to anchor a living room, layer it at the foot of a bed for added comfort, or use it to define a seating area in an open-plan space. It pairs well with Scandinavian and contemporary schemes, natural wood furniture, soft linens, and brushed metal accents for a calm, modern look.", "photos": ["photos/1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v/1.jpg", "photos/1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v/2.jpg", "photos/1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v/3.jpg", "photos/1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v/4.jpg", "photos/1c2-ioAOoWAVifVkVmdJwpJ8Lp6yEZq_v/5.jpg"]}, {"id": "17XyqaWUM0wINeAmLr_SJ_036TcgQiywd", "title": "10' x 13' 1 Lotus Rug - TEAL", "price": "160", "condition": "", "description": "$160 OBO\n\nAn abstract, painterly design softens the room with layered, distressed washes of color set against a teal background. Irregular patches of beige, ivory, light blue, and gray blend into one another in a watercolor-like pattern that balances contemporary and transitional aesthetics. The surface reads as gently worn and lived-in, giving the rug a subtle, artistic presence without a defined medallion or border.\n\nConstructed from 100% polypropylene, the rug has a low pile with a softly cushioned feel underfoot and a mild sheen that catches light without overpowering the palette. Pair it with light wood furniture and neutral upholstery for a coastal-modern look, use it to warm a serene bedroom with ivory linens and pale blues, or layer it in a transitional living room to add color and texture beneath a simple sofa and coffee table.", "photos": ["photos/17XyqaWUM0wINeAmLr_SJ_036TcgQiywd/1.jpg", "photos/17XyqaWUM0wINeAmLr_SJ_036TcgQiywd/2.jpg", "photos/17XyqaWUM0wINeAmLr_SJ_036TcgQiywd/3.jpg", "photos/17XyqaWUM0wINeAmLr_SJ_036TcgQiywd/4.jpg", "photos/17XyqaWUM0wINeAmLr_SJ_036TcgQiywd/5.jpg"]}, {"id": "1S4nVA0y_M20Rc4h8zFkfYVSrfyCXuBap", "title": "10' x 13' Nain Design Rug - IVORY", "price": "235", "condition": "", "description": "$235 OBO\n\nA dense pictorial paradise unfolds across this piece from the Nain Design Collection. Machine-made in Turkey from a blend of 85% polypropylene and 15% polyester, the rug const KEY = "posted-rugs";
let posted = {};
try { posted = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const files = {};  // rug id -> Promise<File[]>, fetched ahead so the share sheet opens right away

function savePosted() { try { localStorage.setItem(KEY, JSON.stringify(posted)); } catch (e) {} }

// Sheet sync: each tap is queued on the phone and sent to the sheet; anything that fails
// (no internet) stays queued and is sent again the next time the page opens.
const SYNC = {"url": "", "token": "NszTc4nRpw91dIWk1mnqUh1JdXQsZVi0", "tab": "Demo"};
const QKEY = "sheet-queue";
let queue = {};
try { queue = JSON.parse(localStorage.getItem(QKEY) || "{}"); } catch (e) {}
function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch (e) {} }

async function flush() {
  if (!SYNC.url) return;
  for (const [id, mark] of Object.entries(queue)) {
    try {
      // text/plain keeps this a "simple" request, which Apps Script accepts from another site
      const res = await fetch(SYNC.url, { method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: SYNC.token, tab: SYNC.tab, id, posted: mark.posted, at: mark.at }) });
      const out = await res.json();
      if (out.ok && queue[id] && queue[id].at === mark.at) { delete queue[id]; saveQueue(); }
    } catch (e) { return; }  // offline: try again next time
  }
}

function queueMark(id) {
  queue[id] = { posted: !!posted[id], at: posted[id] || Date.now() };
  saveQueue();
  flush();
}

function getFiles(rug) {
  if (!files[rug.id]) {
    files[rug.id] = Promise.all(rug.photos.map(async (src, i) => {
      const blob = await (await fetch(src)).blob();
      return new File([blob], `rug-${i + 1}.jpg`, { type: "image/jpeg" });
    }));
  }
  return files[rug.id];
}

function flash(btn, text) {
  const was = btn.textContent;
  btn.textContent = text; btn.classList.add("done");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("done"); }, 1500);
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); flash(btn, "Copied!"); }
  catch (e) {
    // older browsers: copy through a hidden text box
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); t.remove();
    flash(btn, ok ? "Copied!" : "Copy failed");
  }
}

function showLarge(rug) {
  const list = document.getElementById("viewer-list");
  list.replaceChildren(...rug.photos.map((src, i) => {
    const img = document.createElement("img"); img.src = src; img.alt = `${rug.title}, photo ${i + 1}`; return img;
  }));
  document.getElementById("viewer").hidden = false;
  document.getElementById("viewer").scrollTop = 0;
}

// "10' x 10' Hermitage Round Rug - SNOW WHITE" -> "Hermitage"
function fileBase(title) {
  const name = title.split(" - ")[0].replace(/^[\d' x]+(?=[A-Za-z])/, "")
    .replace(/\b(Round|Square|Area|Rug|Runner|Oval)\b/g, "").trim();
  return name.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "rug";
}

// laptop (mouse or trackpad): download straight to the Downloads folder as Hermitage-1.jpg ...
async function downloadPhotos(rug, btn) {
  const base = fileBase(rug.title);
  const f = await getFiles(rug);
  for (let i = 0; i < f.length; i++) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f[i]); a.download = `${base}-${i + 1}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    await new Promise(r => setTimeout(r, 250));  // browsers drop downloads fired all at once
  }
  flash(btn, `Saved to Downloads`);
}

async function savePhotos(rug, btn) {
  if (!rug.photos.length) { flash(btn, "No photos"); return; }
  // laptop and Android: straight to Downloads (Android shows them in Gallery); iPhone: share sheet
  if (matchMedia("(hover: hover) and (pointer: fine)").matches || /Android/i.test(navigator.userAgent)) {
    try { await downloadPhotos(rug, btn); } catch (e) { showLarge(rug); }
    return;
  }
  try {
    const f = await getFiles(rug);
    if (navigator.canShare && navigator.canShare({ files: f })) {
      await navigator.share({ files: f });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;  // she closed the share sheet
  }
  showLarge(rug);
}

function card(rug) {
  const el = document.createElement("article");
  el.className = "card" + (posted[rug.id] ? " posted" : "");
  if (rug.photos[0]) {
    const img = document.createElement("img");
    img.className = "hero"; img.src = rug.photos[0]; img.alt = rug.title; img.loading = "lazy";
    el.appendChild(img);
  }
  const body = document.createElement("div"); body.className = "body";
  const title = document.createElement("h2"); title.className = "title"; title.textContent = rug.title;
  const facts = document.createElement("div"); facts.className = "facts";
  const price = document.createElement("div"); price.className = "price"; price.textContent = rug.price ? "$" + rug.price : "$?";
  const cond = document.createElement("div"); cond.className = "cond";
  cond.append("Condition: ", Object.assign(document.createElement("b"), { textContent: rug.condition || "?" }));
  facts.append(price, cond);
  const desc = document.createElement("p"); desc.className = "desc"; desc.textContent = rug.description;
  const more = document.createElement("button"); more.className = "more"; more.textContent = "Show full description";
  more.onclick = () => { desc.classList.toggle("open"); more.textContent = desc.classList.contains("open") ? "Show less" : "Show full description"; };
  const btns = document.createElement("div"); btns.className = "btns";
  const mk = (label, cls, fn) => { const b = document.createElement("button"); b.className = "big " + cls; b.textContent = label; b.onclick = () => fn(b); return b; };
  btns.append(
    mk(`Save ${rug.photos.length} photos`, "primary", b => savePhotos(rug, b)),
    mk("Copy title", "", b => copy(rug.title, b)),
    mk("Copy description", "", b => copy(rug.description, b)),
    mk(posted[rug.id] ? "Posted ✓  (tap to undo)" : "Mark as posted", "posted-btn", () => {
      if (posted[rug.id]) delete posted[rug.id]; else posted[rug.id] = Date.now();
      savePosted(); queueMark(rug.id); render();
    }),
  );
  body.append(title, facts, desc, more, btns);
  el.appendChild(body);
  // start downloading this rug's photos once its card is near the screen
  new IntersectionObserver((entries, obs) => {
    if (entries.some(e => e.isIntersecting)) { getFiles(rug).catch(() => {}); obs.disconnect(); }
  }, { rootMargin: "400px" }).observe(el);
  return el;
}

function render() {
  const order = [...RUGS].sort((a, b) => (posted[a.id] ? 1 : 0) - (posted[b.id] ? 1 : 0));
  document.getElementById("list").replaceChildren(...order.map(card));
  const left = RUGS.filter(r => !posted[r.id]).length;
  document.getElementById("count").textContent = `${left} of ${RUGS.length} rugs left to post`;
}

document.getElementById("close").onclick = () => { document.getElementById("viewer").hidden = true; };
render();
flush();
addEventListener("online", flush);
</script>
</body>
</html>
